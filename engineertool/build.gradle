buildscript {
    ext.kotlin_version = "1.9.22" // ✅ 최신 안정 버전
    repositories {
        google()
        mavenCentral() // ✅ jcenter 제거
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.2.2" // ✅ 최신 안정 버전
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral() // ✅ jcenter 제거
    }
}

